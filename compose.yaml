x-app: &app
  build: .
  image: local-dev-rag:local
  restart: unless-stopped
  entrypoint: ["/bin/sh", "/app/scripts/start-service.sh"]
  env_file:
    - path: .env
      required: false
  environment:
    PROXY_HOST: 0.0.0.0
    # Container network bind is required; only the host loopback port is published.
    ALLOW_REMOTE_BIND: "true"
    # Settings safely encodes raw credentials; an explicit URL must be percent-encoded.
    DATABASE_URL: ${DATABASE_URL:-}
    POSTGRES_USER: ${POSTGRES_USER:-local_rag}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_rag}
    POSTGRES_DB: ${POSTGRES_DB:-local_rag}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    CHROMADB_URL: http://chromadb:8000
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy
    chromadb:
      condition: service_healthy

services:
  proxy:
    <<: *app
    command: ["uvicorn", "local_dev_rag.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, urllib.request, urllib.error
          assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)) == {'status': 'ok'}
          try:
              ready = urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)
          except urllib.error.HTTPError as error:
              if error.code != 503:
                  raise
              ready = error
          report = json.load(ready)
          assert report['status'] in ('ready', 'degraded', 'not_ready')
          assert isinstance(report['dependencies'], dict)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command: ["python", "-m", "local_dev_rag.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      proxy:
        # Serializes initial Alembic migrations and remains independent of Ollama readiness.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "local_dev_rag.worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-local_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_rag}
      POSTGRES_DB: ${POSTGRES_DB:-local_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.6.3
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  chroma_data:
