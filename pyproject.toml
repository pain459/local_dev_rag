[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-dev-rag"
version = "0.1.0"
description = "Local OpenCode conversation memory proxy"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
]

[project.scripts]
local-dev-rag = "local_dev_rag.cli:main"

[dependency-groups]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]
lint = ["ruff>=0.11,<1", "pyright>=1.1.398,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/local_dev_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
